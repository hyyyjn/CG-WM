# ContactGaussian-WM conda environment
#
# 설치 방법:
#   conda env create -f environment.yml
#   conda activate cg-wm
#
# diff-gaussian-rasterization / simple-knn / fused-ssim은 CUDA 빌드가 필요합니다.
# Visual Studio Build Tools (MSVC) 또는 gcc가 설치되어 있어야 합니다.

name: cg-wm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # ── PyTorch (CUDA 11.8) ──────────────────────────────────────────────────
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=11.8

  # ── 기본 과학 패키지 ────────────────────────────────────────────────────
  - numpy
  - pillow
  - tqdm
  - matplotlib
  - opencv

  - pip:
    # ── 3DGS submodules (repo 안에 포함) ──────────────────────────────────
    # run_demo.ps1 실행 전 아래 명령으로 먼저 빌드해야 합니다:
    #   pip install gaussian_initiailization/submodules/diff-gaussian-rasterization
    #   pip install gaussian_initiailization/submodules/simple-knn
    #   pip install gaussian_initiailization/submodules/fused-ssim
    - ./gaussian_initiailization/submodules/diff-gaussian-rasterization
    - ./gaussian_initiailization/submodules/simple-knn
    - ./gaussian_initiailization/submodules/fused-ssim

    # ── MuJoCo & 물리 ────────────────────────────────────────────────────
    - mujoco>=3.0.0
    - glfw

    # ── 유틸리티 ─────────────────────────────────────────────────────────
    - plyfile
    - joblib
    - ConfigArgParse
    - open3d
    - imageio
    - imageio-ffmpeg
    - PyOpenGL
